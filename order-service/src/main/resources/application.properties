server.port=5002
server.servlet.context-path=/api/v1
spring.application.name=order-service

# Database Configuration
spring.datasource.url=jdbc:mariadb://127.0.0.1:3306/order_db
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=org.mariadb.jdbc.Driver

# JPA/Hibernate Settings
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MariaDBDialect

# Downstream service URLs, called during order placement
services.product.url=http://localhost:5000/api/v1
services.inventory.url=http://localhost:5001/api/v1
services.payment.url=http://localhost:5003/api/v1
